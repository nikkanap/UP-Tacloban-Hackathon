services:
  db:
    image: postgres:17-alpine
    container_name: botokita-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-hackathon}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5332:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME:-hackathon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - botokita

  blockchain:
    image: botokita-blockchain
    container_name: botokita-blockchain
    build:
      context: ./blockchain
    env_file:
      - .env
    environment:
      NETWORK: ${NETWORK:-chipnet}
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://blockchain:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - botokita

  config:
    image: botokita-config
    container_name: botokita-config
    build:
      context: ./config
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      BLOCKCHAIN_API: http://blockchain:3001
    command: >
      sh -c "python manage.py migrate --noinput &&
      python -c \"import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); from django.conf import settings; settings.STATIC_ROOT = '/vol/static'; import django; django.setup(); from django.core.management import call_command; call_command('collectstatic', interactive=False, verbosity=0)\" &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --access-logfile - --error-logfile -"
    volumes:
      - django_static:/vol/static
      - django_media:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://config:8000/api/elections/', timeout=5).read()\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - botokita

  frontend:
    image: botokita-frontend
    container_name: botokita-frontend
    build:
      context: ../frontend
      args:
        VITE_API_LINK: /api/
        VITE_API_BASE_URL: /api
        VITE_EXPLORER_TX_URL: ${VITE_EXPLORER_TX_URL:-https://chipnet.imaginary.cash/tx/}
    volumes:
      - frontend_dist:/usr/share/nginx/html
    command: >
      sh -c "rm -rf /usr/share/nginx/html/* &&
      cp -a /app/dist/. /usr/share/nginx/html/ &&
      tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - botokita

  nginx:
    image: nginx:1.27-alpine
    container_name: botokita-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - django_static:/app/static:ro
      - django_media:/app/media:ro
    depends_on:
      frontend:
        condition: service_healthy
      config:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://nginx/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - botokita

volumes:
  postgres_data:
  frontend_dist:
  django_static:
  django_media:

networks:
  botokita:
    driver: bridge
